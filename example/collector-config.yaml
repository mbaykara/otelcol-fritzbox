receivers:
  fritzbox:
    endpoint: http://192.168.178.1:49000
    username: ${env:FRITZBOX_USERNAME}
    password: ${env:FRITZBOX_PASSWORD}
    collection_interval: 15s
    timeout: 10s
    metrics:
      fritzbox.hosts.active:
        enabled: true
      fritzbox.wan.external_ip:
        enabled: true

exporters:
  debug:
    verbosity: detailed

processors:
  batch:

service:
  pipelines:
    metrics:
      receivers: [fritzbox]
      processors: [batch]
      exporters: [debug]
