version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Collector modules must move together and match
      # example/builder-config.yaml; see CONTRIBUTING.md.
      opentelemetry-collector:
        patterns:
          - "go.opentelemetry.io/collector*"
          - "github.com/open-telemetry/opentelemetry-collector-contrib/*"
      go-dependencies:
        patterns: ["*"]
        exclude-patterns:
          - "go.opentelemetry.io/collector*"
          - "github.com/open-telemetry/opentelemetry-collector-contrib/*"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
