name: Feature request
description: Suggest a new metric, option, or packaging improvement.
labels: [enhancement, needs-triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Receiver metrics
        - Collector distribution
        - Container image
        - Helm chart
        - Dashboard
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: For new metrics, name the TR-064 service and action if you know them.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
