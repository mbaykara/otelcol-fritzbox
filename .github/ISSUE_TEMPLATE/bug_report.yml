name: Bug report
description: Something does not work as documented.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Remove passwords, tokens, public IP addresses, MAC addresses, and host
        names from everything you paste below.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `otelcol-fritzbox --version`, image tag, or chart version.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Release binary
        - Container image
        - Helm chart
        - Custom OCB build
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Device model
      placeholder: FRITZ!Box 7590
    validations:
      required: true
  - type: input
    id: fritzos
    attributes:
      label: FRITZ!OS version
      placeholder: "8.25"
  - type: dropdown
    id: connection
    attributes:
      label: Connection type
      options:
        - DSL
        - Cable
        - Fiber
        - LTE or 5G
        - Other or unknown
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Collector configuration
      description: The relevant receiver and pipeline configuration, credentials removed.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Collector log lines around the problem.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials and personal network data from this report.
          required: true
