name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt check
        run: |
          unformatted=$(gofmt -s -l receiver/ cmd/)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: mdatagen freshness
        run: |
          go tool go.opentelemetry.io/collector/cmd/mdatagen receiver/fritzbox/metadata.yaml
          if ! git diff --exit-code -- receiver/fritzbox/internal/metadata receiver/fritzbox/generated_component_test.go receiver/fritzbox/generated_package_test.go receiver/fritzbox/documentation.md; then
            echo "Generated files are stale. Run 'go generate ./receiver/...' and commit the result."
            exit 1
          fi

      - name: go test
        run: go test ./...

      - name: build collector binary
        run: go build ./cmd/otelcol-fritzbox
